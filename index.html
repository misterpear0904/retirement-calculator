<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexRetire — Modern Interactive Retirement & FIRE Calculator</title>
    <meta
      name="description"
      content="ApexRetire is a modern interactive retirement & FIRE calculator: Monte Carlo simulations, tax modeling, Monte-Carlo-backed plan solving, and Coast FIRE milestones."
    />
    <meta property="og:title" content="ApexRetire — Retirement & FIRE Calculator" />
    <meta
      property="og:description"
      content="Model your retirement plan with Monte Carlo scenarios, real tax rules, Coast FIRE milestones, and a reverse solver."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        window.__apexMounted = false;
        var timer = setTimeout(function () {
          if (window.__apexMounted) return;
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:#020617;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;text-align:center;">' +
            '<div style="max-width:32rem;">' +
            '<h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.75rem;">Something went wrong loading ApexRetire</h1>' +
            '<p style="color:#94a3b8;font-size:0.875rem;margin-bottom:1.25rem;">' +
            'Something went wrong loading ApexRetire — please hard-refresh. If this persists, the latest update failed to deploy.' +
            '</p>' +
            '<button type="button" onclick="window.location.reload()" style="padding:0.5rem 1rem;border-radius:0.75rem;background:#1e293b;border:1px solid #334155;color:#e2e8f0;font-weight:600;cursor:pointer;">Reload</button>' +
            '</div></div>';
        }, 5000);
        window.__apexBootTimer = timer;
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
